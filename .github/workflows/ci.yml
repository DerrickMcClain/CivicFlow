name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__CivicFlow: "Server=localhost,1433;Database=CivicFlow_Test;User Id=sa;Password=CivicFlow_Sql!23;TrustServerCertificate=True;MultipleActiveResultSets=True"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CivicFlow_Sql!23"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"CivicFlow_Sql!23\" -C -Q \"SELECT 1\" -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"CivicFlow_Sql!23\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 25s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore
        run: dotnet restore CivicFlow.sln

      - name: Build
        run: dotnet build CivicFlow.sln --no-restore

      - name: Test
        run: dotnet test CivicFlow.sln --no-build

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
