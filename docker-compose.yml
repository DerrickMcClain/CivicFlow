services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CivicFlow_Sql!23"
    ports:
      - "1433:1433"
    volumes:
      - civicflow-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"CivicFlow_Sql!23\" -C -Q \"SELECT 1\" -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"CivicFlow_Sql!23\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: src/CivicFlow.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CivicFlow: "Server=db,1433;Database=CivicFlow;User Id=sa;Password=CivicFlow_Sql!23;TrustServerCertificate=True"
      BlobStorage__LocalRoot: /data/documents
    volumes:
      - civicflow-docs:/data/documents
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  civicflow-sql:
  civicflow-docs:
